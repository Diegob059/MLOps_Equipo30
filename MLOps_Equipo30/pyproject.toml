[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "MiBici"
version = "0.0.1"
description = "Proyecto con el dataset MiBici aplicando ML para resolver necesidades de negocio"
authors = [
  { name = "Equipo 30" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["MiBici"]
include = ["pyproject.toml", "MiBici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["MiBici"]
force-sort-within-sections = true

